name: Keep Upstash Redis alive

# Upstash deletes free-tier Redis databases after ~30 days without any
# requests, and src/lib/redis.ts hard-crashes without the database â€”
# so this workflow touches Redis every day to keep the database active.

on:
  schedule:
    # Daily at 04:23 UTC (~9:53 AM IST). Off-the-hour times are less
    # likely to be delayed by GitHub's schedule queue.
    - cron: "23 4 * * *"
  workflow_dispatch: {} # enables the manual "Run workflow" button

concurrency:
  group: keep-upstash-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the inactivity self-commit step below
    steps:
      - uses: actions/checkout@v4

      - name: Touch Redis (SET + GET roundtrip)
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UPSTASH_REDIS_REST_URL:-}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
            echo "::error::Repo secrets missing: set UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          set_resp="$(curl -fsS -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" \
            "${UPSTASH_REDIS_REST_URL}/set/testify-keepalive/${stamp}/ex/172800")"
          echo "SET -> ${set_resp}"
          get_resp="$(curl -fsS -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" \
            "${UPSTASH_REDIS_REST_URL}/get/testify-keepalive")"
          echo "GET -> ${get_resp}"
          case "${get_resp}" in
            *"${stamp}"*)
              echo "Redis roundtrip OK â€” database counts as active today."
              ;;
            *)
              echo "::error::Unexpected GET response (roundtrip mismatch)."
              exit 1
              ;;
          esac

      # GitHub auto-disables scheduled workflows on repos with no commits for
      # 60 days. This step pushes a harmless empty "[skip ci]" commit once the
      # last commit is older than 50 days, so this workflow never gets parked.
      - name: Self-commit if repo nearing 60-day inactivity limit
        run: |
          last="$(git log -1 --format=%ct)"
          now="$(date +%s)"
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."
          if [ "${age_days}" -ge 50 ]; then
            git config user.name "testify-keepalive-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "chore(ci): keepalive commit to prevent scheduled workflow disablement [skip ci]"
            git push
            echo "Pushed keepalive commit."
          else
            echo "No keepalive commit needed."
          fi
